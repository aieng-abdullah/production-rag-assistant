# Streamlit theme — docs/UI_DESIGN.md §4.1 (Verified Indigo, light-first)
[theme]
base = "light"
primaryColor = "#4F46E5"
backgroundColor = "#FAFAFA"
secondaryBackgroundColor = "#F1F5F9"
textColor = "#0F172A"
borderColor = "#E2E8F0"
baseRadius = "8px"

# Custom menu only — docs/UI_DESIGN.md §2
[client]
showSidebarNavigation = false
# Hide developer chrome (Deploy button, rerun/clear-cache/about menu entries).
# Only auto|developer|viewer|minimal are valid — anything else raises
# AttributeError in Config.ToolbarMode and kills every session.
toolbarMode = "viewer"

# Hide top-bar host items: GitHub, Fork, record-screencast, main menu.
# Does NOT hide the sidebar expand control, so navigation stays usable.
[ui]
hideTopBar = true
