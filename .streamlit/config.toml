# Streamlit theme — docs/UI_DESIGN.md §4.1 (Verified Indigo, light-first)
[theme]
base = "light"
primaryColor = "#4F46E5"
backgroundColor = "#FAFAFA"
secondaryBackgroundColor = "#F1F5F9"
