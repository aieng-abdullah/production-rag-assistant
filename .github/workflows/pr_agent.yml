name: PR Agent

on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize]
  issue_comment:

jobs:
  pr_agent_job:
    if: ${{ github.event.sender.type != 'Bot' }}
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
      contents: write
      checks: write
    name: PR review on every pull request, respond to user comments
    steps:
      - name: PR Agent action step
        id: pragent
        uses: the-pr-agent/pr-agent@v0.46.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # OpenRouter free router (auto-picks best free model), Groq fallback
          config.model: "openrouter/free"
          config.fallback_models: '["groq/llama-3.3-70b-versatile"]'
          openrouter__key: ${{ secrets.OPENROUTER_API_KEY }}
          GROQ.KEY: ${{ secrets.GROQ_API_KEY }}
          # Automatic tools on PR events
          github_action_config.auto_review: "true"
          github_action_config.auto_describe: "true"
          github_action_config.auto_improve: "true"
          github_action_config.pr_actions: '["opened", "reopened", "synchronize", "ready_for_review"]'
          # Repo-specific review rules
          pr_reviewer.require_tests_review: "true"
          pr_reviewer.require_security_review: "true"
          pr_reviewer.persistent_comment: "true"
