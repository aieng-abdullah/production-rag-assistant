name: Tests

on:
  pull_request:
    branches: [main]
  # Re-verify after merge. Without this, main is never tested: the
  # pull_request run covers the head branch, and if a merge lands
  # anything the head run did not cover, nothing catches it. That is how
  # three red PRs (#128, #129, #130) merged on 2026-10-10 — they were
  # red on a pre-existing dependency failure that #131 then fixed, and
  # no post-merge run ever re-checked them.
  push:
    branches: [main]

# One run per ref. A new push supersedes the previous one instead of
# queueing behind it.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install ruff
        run: pip install ruff==0.15.10

      - name: Ruff lint
        run: ruff check src tests eval alembic

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run fast tests
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          LOG_LEVEL: INFO
        # Coverage gate lives in the local AGENTS.md command, not on PRs.
        # --cov-fail-under=0 overrides pytest.ini addopts (CLI wins over ini).
        run: pytest tests/ -v -m "not slow" --cov-fail-under=0
